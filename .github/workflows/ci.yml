name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax (py_compile)
        run: |
          python -m py_compile alert_dispatcher.py app.py circular_buffer.py crash_detection.py data_logger.py main.py sensor_manager.py
          python -m py_compile src/*.py
          python -m py_compile scripts/*.py
          python -m py_compile tests/*.py

      - name: Run automated unit tests
        run: |
          python -m unittest tests/test_unit.py -v

      - name: Run GSM SMS simulation test
        run: |
          python tests/test_gsm_sms.py
